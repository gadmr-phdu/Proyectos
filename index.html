function parseCsvSemicolon(text){
  const rows=[];let row=[],field='',quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else quoted=false;}else field+=c;continue;}
    if(c==='"'){quoted=true;continue;}
    if(c===';'){row.push(field);field='';continue;}
    if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field='';continue;}
    field+=c;
  }
  if(field!==''||row.length){row.push(field.replace(/\r$/,''));rows.push(row);}
  if(!rows.length)return [];
  const headers=rows.shift().map((h,i)=>String(h||'').replace(/^\ufeff/,'').trim());
  return rows.filter(r=>r.some(x=>String(x||'').trim()!=='')).map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??'')])));
}

function annexesFromReport(){
  const di=selected?.datos_informe||{};
  const candidates=[
    di?.aprobatorio?.anexos,
    di?.formulario?.aprobatorio?.anexos,
    di?.anexos,
    selected?.aprobatorio?.anexos
  ];
  const rows=candidates.find(Array.isArray)||[];
  if(!rows.length)return '';
  return rows.map((a,i)=>{
    const tipo=String(a?.tipo||'carpeta').trim();
    const label=(tipo?tipo.charAt(0).toUpperCase()+tipo.slice(1):'Carpeta')+' '+(i+1);
    const fojas=String(a?.fojas??'').trim();
    const planos=String(a?.planos??'').trim();
    const cds=String(a?.cds??'').trim();
    const parts=[];
    if(fojas)parts.push(fojas+' fojas');
    if(a?.incluyePlanos && planos && Number(planos)!==0)parts.push('incluido '+planos+' plano'+(String(planos)==='1'?'':'s')+' en su foliado');
    if(a?.incluyeCds && cds && Number(cds)!==0)parts.push('+ '+cds+' CD'+(String(cds)==='1'?'':'s'));
    return label+': '+parts.join(' ');
  }).filter(Boolean).join('\n');
}

<script id="allpa-resolucion-desistimiento-v1-script">
(function(){
'use strict';
const VERSION='1.0.5-resolucion-desistimiento-filtros-iconos';
const SUPABASE_URL='https://lfinvpmobnczgtabtwfs.supabase.co';
const KEY='sb_publishable_oARH0ZQa0_d8w_dkYYd1dw_NlWSUn9i';
const TEMPLATE_URLS=['../data/plantillas/resolucion_desistimiento.csv','../data/resolucion_desistimiento.csv'];
const EMBEDDED_TEMPLATE_CSV="ID_Bloque;Orden;Pagina_Referencia;Seccion;Titulo;Texto_Base;Tipo_Bloque;Variables;Fuente_Datos;Mostrar;Aplica_Motivo;Observacion_Interna\nCFG_001;1;;CONFIGURACION;DIRECTOR_NOMBRE;ING. JUAN DIEGO REMACHE RIVERA MGS.;CONFIG;;CSV;SI;TODOS;\nCFG_002;2;;CONFIGURACION;DIRECTOR_CARGO;DIRECTOR GENERAL DE GESTIÓN DE PLANIFICACIÓN, HÁBITAT Y DESARROLLO URBANÍSTICO;CONFIG;;CSV;SI;TODOS;\nCFG_003;3;;CONFIGURACION;ACCION_PERSONAL_DIRECTOR;DG-TH-2026 -LRN-2;CONFIG;;CSV;SI;TODOS;\nCFG_004;4;;CONFIGURACION;FECHA_ACCION_PERSONAL_DIRECTOR;08 de enero de 2026;CONFIG;;CSV;SI;TODOS;\nCFG_005;5;;CONFIGURACION;MEMORANDO_CRITERIO_JURIDICO;GADMR-PROC-2026-0038-M;CONFIG;;CSV;SI;TODOS;\nCFG_006;6;;CONFIGURACION;SIGLA_RESOLUCION;GADMR-GPHDU-DES;CONFIG;;CSV;SI;TODOS;\nCFG_007;7;;CONFIGURACION;PLANTILLA_VERSION;resolucion_desistimiento_obra_mayor_v3;CONFIG;;CSV;SI;TODOS;\nENC_001;10;1;ENCABEZADO;TITULO;[B]RESOLUCIÓN ADMINISTRATIVA Nro. {{NUMERO_RESOLUCION}}[/B];DINAMICO;NUMERO_RESOLUCION;Resolución Desistimiento;SI;TODOS;\nENC_002;11;1;ENCABEZADO;DIRECTOR;{{DIRECTOR_NOMBRE}};DINAMICO_CONFIG;DIRECTOR_NOMBRE;CFG_001;SI;TODOS;\nENC_003;12;1;ENCABEZADO;CARGO;[B]{{DIRECTOR_CARGO}}[/B];DINAMICO_CONFIG;DIRECTOR_CARGO;CFG_002;SI;TODOS;\nENC_004;13;1;ENCABEZADO;CONSIDERANDO;CONSIDERANDO:;FIJO;;CSV;SI;TODOS;\nCON_001;20;1;CONSIDERANDO;NOMBRAMIENTO;\"[B]Que,[/B] el Ingeniero Juan Diego Remache Rivera nombrado legalmente en calidad de Director General de Gestión de Planificación, Hábitat y Desarrollo Urbanístico, mediante Acción de Personal No. {{ACCION_PERSONAL_DIRECTOR}}, que rige a partir del {{FECHA_ACCION_PERSONAL_DIRECTOR}};\";DINAMICO_CONFIG;ACCION_PERSONAL_DIRECTOR|FECHA_ACCION_PERSONAL_DIRECTOR;CFG_003|CFG_004;SI;TODOS;\nCON_002;21;1;CONSIDERANDO;CONSTITUCION_82;\"[B]Que,[/B] el artículo 82 de la Constitución de la República dispone “El derecho a la seguridad jurídica se fundamenta en el respeto a la Constitución y en la existencia de normas jurídicas previas, claras, públicas y aplicadas por las autoridades competentes”;\";FIJO;;CSV;SI;TODOS;\nCON_003;22;1;CONSIDERANDO;CONSTITUCION_225;[B]Que,[/B] el artículo 225 de la Constitución de la República del Ecuador, señala que son parte de la Administración Pública, los siguientes: 1. “Los organismos y dependencias de las funciones Ejecutiva, Legislativa, Judicial, Electoral y de Transparencia y Control Social. 2. Las entidades que integran el régimen autónomo descentralizado. 3. Los organismos y entidades creados por la Constitución o la ley para el ejercicio de la potestad estatal, para la prestación de servicios públicos o para desarrollar actividades económicas asumidas por el Estado. 4. Las personas jurídicas creadas por acto normativo de los gobiernos autónomos descentralizados para la prestación de servicios públicos.”;FIJO;;CSV;SI;TODOS;\nCON_004;23;1;CONSIDERANDO;CONSTITUCION_226;\"[B]Que,[/B] el artículo 226 de la Constitución de la República establece “Las instituciones del Estado, sus organismos, dependencias, las servidoras o servidores públicos y las personas que actúen en virtud de una potestad estatal ejercerán solamente las competencias y facultades que les sean atribuidas en la Constitución y la ley. Tendrán el deber de coordinar acciones para el cumplimiento de sus fines y hacer efectivo el goce y ejercicio de los derechos reconocidos en la Constitución”;\";FIJO;;CSV;SI;TODOS;\nCON_005;24;1;CONSIDERANDO;CONSTITUCION_264;\"[B]Que,[/B] el número 2 del artículo 264 de la Constitución de la República del Ecuador indica: “Los gobiernos municipales tendrán las siguientes competencias exclusivas sin perjuicio de otras que determine la ley: 2. Ejercer el control sobre el uso y ocupación del suelo en el cantón.”;\";FIJO;;CSV;SI;TODOS;\nCON_006;25;1;CONSIDERANDO;COOTAD_55;\"[B]Que,[/B] el artículo 55 letra b) del Código Orgánico de Organización Territorial Autonomía y Descentralización determina “Los gobiernos autónomos descentralizados municipales tendrán las siguientes competencias exclusivas sin perjuicio de otras que determine la ley; (…) b) Ejercer el control sobre el uso y ocupación del suelo en el cantón”;\";FIJO;;CSV;SI;TODOS;\nCON_007;30;2;CONSIDERANDO;COA_3;\"[B]Que,[/B] el artículo 3 del Código Orgánico Administrativo dispone: “Principio de eficacia. Las actuaciones administrativas se realizan en función del cumplimiento de los fines previstos para cada órgano o entidad pública, en el ámbito de sus competencias”;\";FIJO;;CSV;SI;TODOS;\nCON_007_A;30.1;2;CONSIDERANDO;COA_14;\"[B]Que,[/B] el artículo 14 del Código Orgánico Administrativo establece: “Principio de juridicidad. La actuación administrativa se somete a la Constitución, a los instrumentos internacionales, a la ley, a los principios, a la jurisprudencia aplicable y al presente Código”;\";FIJO;;CSV;SI;TODOS;\nCON_007_B;30.2;2;CONSIDERANDO;COA_100;\"[B]Que,[/B] el artículo 100 del Código Orgánico Administrativo indica que “todo acto administrativo debe estar motivado y se deberá observar: 1.- El señalamiento de la norma jurídica o principios jurídicos aplicables y la determinación de su alcance, 2.- La calificación de los hechos relevantes para la adopción de la decisión, sobre la base de la evidencia que conste en el expediente administrativo y 3.- La explicación de la pertinencia del régimen jurídico invocado en relación con los hechos determinados”;\";FIJO;;CSV;SI;TODOS;\nCON_008;31;2;CONSIDERANDO;COA_140;[B]Que,[/B] el artículo 140 del COA dice: “Subsanaciones. Cuando alguno de los actos de la persona interesada no reúna los requisitos necesarios, la administración pública le notificará para que, en el término de diez días, subsane su omisión. La administración pública especificará los requisitos que deben ser enmendados por la persona interesada con la indicación de su fundamento legal, técnico o económico y las instrucciones detalladas del modo en que debe proceder para subsanar las deficiencias. Si la persona interesada no cumple lo dispuesto por la administración pública se entenderá como desistimiento y será declarado en la resolución. La administración pública no podrá disponer el archivo del procedimiento o la restitución de la petición a la persona interesada sin haber dispuesto la subsanación. Su omisión constituye una falta grave del servidor público y no suspende el procedimiento administrativo para todos los propósitos previstos en este Código”,;FIJO;;CSV;SI;OBSERVACIONES;\nCON_009;32;2;CONSIDERANDO;COA_183;\"[B]Que,[/B] el primer inciso del Artículo 183 del COA determina: “Iniciativa. El procedimiento administrativo puede iniciarse de oficio o a solicitud de la persona interesada”;\";FIJO;;CSV;SI;TODOS;\nCON_009_A;32.1;2;CONSIDERANDO;COA_201;[B]Que,[/B] en el artículo 201 de mencionada Ley, se establecen las formas de terminación del procedimiento administrativo. “El procedimiento administrativo termina por: 1. El acto administrativo. 2. El silencio administrativo. 3. El desistimiento. 4. El abandono. 5. La caducidad del procedimiento o de la potestad pública. 6. La imposibilidad material de continuarlo por causas imprevistas. 7. La terminación convencional”;FIJO;;CSV;SI;TODOS;\nCON_010;33;2;CONSIDERANDO;COA_211;\"[B]Que,[/B] el artículo 211 del Código Orgánico Administrativo establece que la persona interesada puede desistir del procedimiento cuando no esté prohibido por la ley, debiendo indicarse si el desistimiento es total o parcial y dejando constancia por un medio que permita verificarlo antes de la notificación del acto administrativo;\";FIJO;;CSV;SI;PETICION;\nCON_011;40;3;CONSIDERANDO;ORD_657;\"[B]Que,[/B] el artículo 657 de la Ordenanza Nro. 016-2023 que contiene la actualización del Código Urbano para el Cantón Riobamba (publicada en el Registro Oficial, Edición Especial No. 885 del 23 de mayo del 2023) establece: “De la Obligatoriedad de Correo o Plataforma Electrónica para Notificaciones. - Los interesados de manera obligatoria al ingreso del trámite correspondiente, deberán señalar correo electrónico para recibir notificaciones;\";FIJO;;CSV;SI;TODOS;\nCON_012;41;3;CONSIDERANDO;ORD_38;\"[B]Que,[/B] el Artículo. 38 de la Ordenanza Nro. 016-2023 que contiene la actualización del Código Urbano para el Cantón Riobamba (publicada en el Registro Oficial, Edición Especial No. 885 del 23 de mayo del 2023) establece: “…. para el Otorgamiento de Licencias Urbanísticas y Autorización Urbanística Preliminar de Propiedad Horizontal.- Se sujetan al procedimiento administrativo general las Licencias Urbanísticas de Subdivisiones que impliquen realización de obras de infraestructura básica; Urbanizaciones; Obras Mayores, Edificación en Áreas Históricas; Proyectos Especiales; y, la Autorización urbanística preliminar de Propiedad Horizontal, cuyo procedimiento es el siguiente: 1. En el procedimiento general el trámite iniciará con la presentación por parte del interesado del formulario con los requisitos que correspondan a la actuación materia del licenciamiento. 2. En los casos de Proyectos de Subdivisiones de dos a diez predios que impliquen realización de obras de infraestructura básica, Anteproyectos y Proyectos de Subdivisiones de más de diez predios (Urbanización) y Autorización Urbanística Preliminar de Propiedad Horizontal, el trámite se asignará a la Mesa Técnica Institucional para que verifique el cumplimiento de requisitos, Reglas Técnicas y Normas Administrativas del proyecto; y, elabore el informe técnico legal correspondiente.2.2. En caso de existir observaciones en el informe técnico legal o informe técnico, que deban subsanarse por parte del interesado, la mesa técnica institucional o el técnico asignado, notificará al interesado sentando razón para que dentro de 10 días hábiles cumpla con los requerimientos. [B][IU](…) En caso de que no se subsanen las observaciones por parte del interesado, la mesa técnica institucional o el técnico asignado sentará razón y emitirá el informe técnico legal o informe técnico correspondiente; y, lo pondrá en conocimiento de la Autoridad Administrativa Otorgante, para la devolución de las actuaciones mediante resolución administrativa, dejando a salvo el derecho del administrado volver a presentar una nueva solicitud”;[/IU][/B]\";FIJO;;CSV;SI;OBSERVACIONES;\nCON_013;42;3;CONSIDERANDO;CRITERIO_JURIDICO;[B]Que,[/B] el Memorando Nro. {{MEMORANDO_CRITERIO_JURIDICO}}, contiene el criterio jurídico, mediante el cual se determina: [I]“(…) Deberá la Dirección General de Gestión de Planificación, Habitad y Desarrollo Urbanístico, asumir todas las actividades, atribuciones y deberes y obligaciones que estaba a cargo de la Dirección General de Ordenamiento Territorial y aquellas que le sean similares que constan dentro de las ordenanza, hasta que las mismas sean reformadas o sustituidas, esto en cumplimiento de todos los artículos antes citados y tomando en consideración que el servicio público no puede paralizarse. (…)”.[/I];DINAMICO_CONFIG;MEMORANDO_CRITERIO_JURIDICO;CFG_005;SI;TODOS;\nCON_014;50;4;HECHOS;INGRESO_TRAMITE;\"[B]Que,[/B] mediante el Formulario de Revisión de Reglas Técnicas de {{TIPO_FORMULARIO}}, de fecha {{FECHA_INGRESO_LARGA}}, suscrito por {{PROPIETARIOS_TEXTO}} y por {{PROYECTISTA}}, en calidad de profesional responsable del proyecto, se ingresa en el sistema municipal E-GOB el trámite Nro. {{EGOB}}, correspondiente a {{OBJETO_PROCEDIMIENTO}}, denominado “{{NOMBRE_PROYECTO}}”, de uso {{USO_PROYECTO}}, con una altura de edificación de {{ALTURA_EDIFICACION_TEXTO}}. El proyecto se emplaza en el predio de propiedad de {{PROPIETARIOS_TEXTO}}, con identificación(es) Nro. {{DOCUMENTOS_PROPIETARIOS}}, ubicado en la parroquia {{PARROQUIA}}, sector {{BARRIO_SECTOR}}, {{DIRECCION}}, con clave catastral Nro. {{CLAVE_CATASTRAL}} y código PIT {{CODIGO_PIT}};\";DINAMICO;TIPO_FORMULARIO|FECHA_INGRESO_LARGA|PROPIETARIOS_TEXTO|PROYECTISTA|EGOB|OBJETO_PROCEDIMIENTO|NOMBRE_PROYECTO|USO_PROYECTO|ALTURA_EDIFICACION_TEXTO|DOCUMENTOS_PROPIETARIOS|PARROQUIA|BARRIO_SECTOR|DIRECCION|CLAVE_CATASTRAL|CODIGO_PIT;Informe Desistimiento / Supabase;SI;TODOS;\nCON_015;51;4;HECHOS;NOTIFICACION_OBSERVACIONES;\"[B]Que,[/B] una vez realizada la revisión de la documentación y del proyecto técnico, con fecha {{FECHA_NOTIFICACION_OBSERVACIONES_LARGA}} se procedió con la notificación de las observaciones encontradas en el trámite por parte de {{TECNICO_NOMBRE}}, {{TECNICO_FIRMA_CARGO}}, al correo {{CORREO_NOTIFICACION}}, señalado para recibir notificaciones, a fin de que el administrado justifique, rectifique o subsane los requerimientos dentro del término otorgado por la administración;\";DINAMICO_ABOGADA;FECHA_NOTIFICACION_OBSERVACIONES_LARGA|TECNICO_NOMBRE|TECNICO_FIRMA_CARGO|CORREO_NOTIFICACION;Informe / ABOGADA;SI;OBSERVACIONES;\nCON_016;52;4-5;HECHOS;INFORME_DESISTIMIENTO;\"[B]Que,[/B] una vez revisado el trámite, el técnico a cargo sienta razón y procede con la elaboración del Informe Técnico de Desistimiento, mediante Memorando Nro. {{MEMORANDO_DESISTIMIENTO}}, de fecha {{FECHA_MEMORANDO_DESISTIMIENTO_LARGA}}, suscrito por {{TECNICO_NOMBRE}}, {{TECNICO_FIRMA_CARGO}}, quien en lo pertinente manifiesta: “{{EXTRACTO_INFORME_DESISTIMIENTO}}”;\";DINAMICO_ABOGADA;MEMORANDO_DESISTIMIENTO|FECHA_MEMORANDO_DESISTIMIENTO_LARGA|TECNICO_NOMBRE|TECNICO_FIRMA_CARGO|EXTRACTO_INFORME_DESISTIMIENTO;Informe / ABOGADA;SI;TODOS;\nCON_017_OBS;60;5-6;MOTIVACION;SINTESIS_OBSERVACIONES;\"[B]Que,[/B] de acuerdo con lo previsto en el artículo 82 de la Constitución de la República del Ecuador vigente que manifiesta: “El derecho a la seguridad jurídica se fundamenta en el respeto a la Constitución y en la existencia de normas jurídicas previas, claras, públicas y aplicadas por las autoridades competentes”. Dicho esto, el artículo 226 de la Constitución de la República establece que: “Las instituciones del Estado, sus organismos, dependencias, las servidoras o servidores públicos y las personas que actúen en virtud de una potestad estatal ejercerán solamente las competencias y facultades que les sean atribui       const parts=String(node.nodeValue||'').match(/\S+\s*|\s+/g)||[];
      for(const part of parts){
        let child=document.createTextNode(part);
        for(let i=wrappers.length-1;i>=0;i--){const w=wrappers[i].cloneNode(false);w.appendChild(child);child=w;}
        tokens.push(child);
      }
      return;
    }
    if(node.nodeType===Node.ELEMENT_NODE){if(String(node.tagName||'').toUpperCase()==='BR'){tokens.push(document.createElement('br'));return;}const next=wrappers.concat([node]);[...node.childNodes].forEach(ch=>walk(ch,next));}
  };

}
function drvEmptyBlockLike(block){
  const clone=block.cloneNode(false);const p=document.createElement('p');clone.appendChild(p);return {block:clone,p};
}
function drvPaginateBlocks(blocks,signatureHtml,host){
  host.innerHTML='';let content=drvCreatePage(host);
  const fits=()=>content.scrollHeight<=content.clientHeight+2;
  for(const src of blocks){
    const holder=document.createElement('div');holder.innerHTML=src.html;const block=holder.firstElementChild;
    content.appendChild(block);
    if(fits())continue;
    content.removeChild(block);
    const p=block.querySelector('p');
    if(!p){content=drvCreatePage(host);content.appendChild(block);continue;}
    const tokens=drvInlineTokens(p);
    let piece=drvEmptyBlockLike(block);content.appendChild(piece.block);
    if(!fits() && piece.p.childNodes.length===0){content.removeChild(piece.block);content=drvCreatePage(host);piece=drvEmptyBlockLike(block);content.appendChild(piece.block);}
    for(const token of tokens){
      const n=token.cloneNode(true);piece.p.appendChild(n);
      if(!fits()){
        piece.p.removeChild(n);
        if(!String(piece.p.textContent||'').trim())content.removeChild(piece.block);
        content=drvCreatePage(host);piece=drvEmptyBlockLike(block);content.appendChild(piece.block);piece.p.appendChild(n);
      }
    }
  }
  if(signatureHtml){
    const wrap=document.createElement('div');wrap.innerHTML=signatureHtml;const sig=wrap.firstElementChild;content.appendChild(sig);
    if(!fits()){content.removeChild(sig);content=drvCreatePage(host);content.appendChild(sig);}
  }
}
